<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint under the notch and home
         indicator; the safe-area insets in index.css put the content back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#13010c" />

    <title>wireframe — text to manufacturable jewellery CAD</title>
    <meta
      name="description"
      content="Describe a piece in plain language and get a parametric, manufacturable 3D model — measured, checked against real casting limits, and exported as exact STEP or STL."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="wireframe — text to manufacturable jewellery CAD" />
    <meta
      property="og:description"
      content="Describe a piece in plain language and get a parametric, manufacturable 3D model — measured, checked, and export-ready."
    />
    <meta property="og:image" content="/icons/Wireframe.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/icons/Wireframe.png" />
    <link rel="apple-touch-icon" href="/icons/Wireframe.png" />

    <!-- Type. Instrument Serif for display, Inter Tight for interface, JetBrains
         Mono for every number and spec label. preconnect first so the fonts
         start downloading during HTML parse rather than after the CSS lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:ital,wght@0,300..700;1,300..600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
